<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вход — Rental Manager</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .auth-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .auth-logo p {
            margin: 0;
            color: #6b7280;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .auth-button {
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-button:hover {
            background: #1d4ed8;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .auth-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .auth-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-logo">

                <h1>Rental Manager</h1>

                <p>Вход в систему</p>

            </div>


            <form
                class="auth-form"
                id="loginForm"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ivan@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Пароль
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Введите пароль"
                        required
                    >

                </div>


                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Войти
                </button>

            </form>


            <div class="auth-footer">

                Нет аккаунта?

                <a href="register.html">
                    Зарегистрироваться
                </a>

            </div>

        </section>

    </main>


    <script>

        const API_URL = "http://localhost:3000";

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const authMessage =
            document.getElementById("authMessage");


        function showMessage(
            message,
            type
        ) {

            authMessage.textContent = message;

            authMessage.className =
                `auth-message ${type}`;

        }


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                loginButton.disabled = true;

                loginButton.textContent =
                    "Вход...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/auth/login`,
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email,
                                    password

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Ошибка входа"
                        );

                    }


                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    localStorage.setItem(
                        "user",
                        JSON.stringify(
                            data.user
                        )
                    );


                    showMessage(
                        "Вход выполнен. Переходим...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "../index.html";

                        },
                        500
                    );


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Войти";

                }

            }
        );

    </script>
    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>

</body>

</html>
