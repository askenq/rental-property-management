<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Регистрация — Rental Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;

            color: #172033;

        }


        .auth-container {

            width: 100%;

            max-width: 440px;

            padding: 20px;

        }


        .auth-card {

            background: #ffffff;

            border: 1px solid #dfe4ec;

            border-radius: 18px;

            padding: 36px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.06);

        }


        .auth-logo {

            text-align: center;

            margin-bottom: 28px;

        }


        .auth-logo-icon {

            width: 52px;

            height: 52px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background: #2864e8;

            color: #ffffff;

            font-size: 20px;

            font-weight: 700;

        }


        .auth-logo h1 {

            margin: 0 0 7px;

            font-size: 27px;

        }


        .auth-logo p {

            margin: 0;

            color: #6d7788;

        }


        .form-group {

            margin-bottom: 17px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

        }


        .form-group input,
        .form-group select {

            width: 100%;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #ccd3df;

            border-radius: 10px;

            background: #ffffff;

            font-size: 15px;

            outline: none;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #2864e8;

        }


        .form-hint {

            display: block;

            margin-top: 6px;

            color: #7b8493;

            font-size: 12px;

        }


        .submit-button {

            width: 100%;

            height: 46px;

            border: 0;

            border-radius: 10px;

            background: #2864e8;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 7px;

        }


        .submit-button:hover {

            background: #1f56d0;

        }


        .submit-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .error-message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 9px;

            background: #fff0f0;

            color: #c62828;

            font-size: 14px;

        }


        .success-message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 9px;

            background: #eefbf2;

            color: #21743a;

            font-size: 14px;

        }


        .auth-footer {

            margin-top: 23px;

            text-align: center;

            color: #6d7788;

            font-size: 14px;

        }


        .auth-footer a {

            color: #2864e8;

            font-weight: 600;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <div class="auth-logo">

            <div class="auth-logo-icon">
                RM
            </div>

            <h1>
                Rental Manager
            </h1>

            <p>
                Создание аккаунта
            </p>

        </div>



        <form id="registerForm">


            <div class="form-group">

                <label for="name">
                    Имя
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Иван Петров"
                    required
                >

            </div>



            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ivan@example.com"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Минимум 6 символов"
                    minlength="6"
                    required
                >

            </div>



            <div class="form-group">

                <label for="role">
                    Роль
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="">
                        Выберите роль
                    </option>

                    <option value="OWNER">
                        Владелец недвижимости
                    </option>

                    <option value="MANAGER">
                        Управляющий недвижимостью
                    </option>

                    <option value="TENANT">
                        Арендатор
                    </option>

                </select>


                <span class="form-hint">
                    Выберите роль пользователя
                </span>

            </div>



            <button
                type="submit"
                class="submit-button"
                id="registerButton"
            >
                Зарегистрироваться
            </button>



            <div
                class="error-message"
                id="errorMessage"
            ></div>


            <div
                class="success-message"
                id="successMessage"
            ></div>


        </form>



        <div class="auth-footer">

            Уже есть аккаунт?

            <a href="login.html">
                Войти
            </a>

        </div>


    </div>

</div>


<script src="../js/common.js"></script>
<script src="../js/register.js"></script>


</body>

</html>
