<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Rental Manager</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ui.css">
    <script src="../js/config.js"></script>
    <script src="../js/theme.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
        }

        .auth-wrap {
            width: 100%;
            max-width: 400px;
        }

        .auth-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .auth-brand-mark {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: var(--primary);
            color: var(--on-primary);
        }

        .auth-brand-mark svg {
            width: 15px;
            height: 15px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .auth-logo {
            margin-bottom: 20px;
        }

        .auth-logo h1 {
            margin: 0 0 4px;
            font-size: 18px;
            font-weight: 600;
        }

        .auth-logo p {
            margin: 0;
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 36px;
            padding: 0 11px;
        }

        .form-hint {
            color: var(--text-muted);
            font-size: 11px;
        }

        .submit-button {
            width: 100%;
            height: 36px;
            margin-top: 4px;
            border: 1px solid var(--primary);
            border-radius: var(--radius-md);
            background: var(--primary);
            color: var(--on-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition);
        }

        .submit-button:hover {
            background: var(--primary-hover);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message,
        .error-message,
        .success-message {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 12.5px;
        }

        .auth-message.error,
        .error-message {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-border);
        }

        .auth-message.error { display: block; }

        .auth-message.success,
        .success-message {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid var(--success-border);
        }

        .auth-message.success { display: block; }

        .auth-footer {
            margin-top: 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main class="auth-wrap">
    <div class="auth-top">
        <div class="auth-brand">
            <div class="auth-brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
            </div>
            <span>Rental Manager</span>
        </div>

        <button type="button" class="theme-toggle" id="authThemeToggle" aria-label="Переключить тему" title="Переключить тему">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>

    <section class="auth-card">
        <div class="auth-logo">
            <h1>Создание аккаунта</h1>
            <p>Заполните основные сведения о пользователе</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Имя и фамилия</label>
                <input type="text" id="name" name="name" placeholder="Иван Петров" required>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email" placeholder="ivan@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Минимум 6 символов" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="role">Роль в системе</label>
                <select id="role" name="role" required>
                    <option value="">Выберите роль</option>
                    <option value="OWNER">Владелец недвижимости</option>
                    <option value="MANAGER">Управляющий недвижимостью</option>
                    <option value="TENANT">Арендатор</option>
                </select>
                <span class="form-hint">Определяет уровень доступа и вид личного кабинета</span>
            </div>

            <button type="submit" class="submit-button" id="registerButton">
                Зарегистрироваться
            </button>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </form>
    </section>

    <div class="auth-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>
</main>

<script>
    document.getElementById("authThemeToggle")?.addEventListener("click", () => window.RMTheme?.toggle());
</script>
<script src="../js/common.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
